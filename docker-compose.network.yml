# Prefer: keep docker-compose.client.yml and run ./switch-network.sh
# (updates VITE_API_BASE_URL / ALLOWED_ORIGINS in .env).
# This file is a LAN-oriented fallback if you still copy it manually.
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pos-shop-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-billing_app}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-user1}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-asroma}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - pos-shop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user1 -d billing_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: antonalmishev/supermarket-pos-backend:latest
    container_name: pos-shop-backend
    ports:
      - "8087:8087"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-billing_app}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-user1}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-asroma}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SERVER_PORT: "8087"
      SERVER_SERVLET_CONTEXT_PATH: /api/v1.0
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pos-shop-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8087/api/v1.0/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    image: antonalmishev/supermarket-pos-frontend:latest
    container_name: pos-shop-frontend
    ports:
      - "3001:80"
    environment:
      # Replace 192.168.80.120 with the shop server LAN IP, or use ./switch-network.sh instead
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://192.168.80.120:8087/api/v1.0}
      - BACKEND_URL=${BACKEND_URL:-http://192.168.80.120:8087}
    depends_on:
      - backend
    networks:
      - pos-shop-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  pos-shop-network:
    name: supermarket_pos-shop-network
    driver: bridge

volumes:
  postgres_data:
    name: supermarket_postgres_data
    driver: local
